simulation:
  name: "spectral_test_run"
  backend: "cpu"       # Options: "cpu" (standard), "gpu" (if supported)
  duration:
    value: 0.0005
    unit: "s"
  dt:
    value: 5.0e-6
    unit: "s"
  update_interval: 20         # steps (ETA update every 20 steps)

domain:
  size:
    value: [0.01, 0.005, 0.0025]  # [Lx, Ly, Lz] in m
    unit: "m"
  mesh:
    value: [512, 256, 1024]        # [nx, ny, nz]
    unit: ""

material:
  name: "316L"
  rho:
    value: 7957.544888242
    unit: "kg/m3"
  k:
    value: 13.851029999999998
    unit: "W/(m.K)"
  Cp:
    value: 497.8904
    unit: "J/(kg.K)"
  L_f:
    value: 2.677e5
    unit: "J/kg"
  T_solidus:
    value: 1674.15
    unit: "K"
  T_liquidus:
    value: 1697.15
    unit: "K"
  T0:
    value: 293.0
    unit: "K"
  DeltaH_LV:
    value: 7.416e6
    unit: "J/kg"
  R_v:
    value: 150.774
    unit: "J/(kg.K)"
  Pa:
    value: 101325.0
    unit: "Pa"
  T_boil:
    value: 3090.0
    unit: "K"

laser:
  radius:
    value: 60.0e-6
    unit: "m"
  absorptivity: 0.30
  power_nominal:
    value: 200.0
    unit: "W"
  path:
    type: "gcode"
    file: "linear_track.gcode"

io:
  output_interval:
    value: 1
    unit: "dimensionless"
  outputs: []
  at_end: ["profiles", "slices"]
  profiles_locations:
    - 'hotspot'                       # 'laser', 'hotspot', or explicit [x, y] in m
  slice_planes:
    - name: "transverse_section"
      normal: "x"
      isotherms:
        - ["T_s", 1674.15]
