# Temperature-dependent 316L — mirrors the FE reference
# (andreas_heat_solv/simulations/2_comparison_FE/Theo_cuboid_FE_temp_dep.py).
# Property branches are the Chadwick polynomials (ascending powers of T, SI).
# Intended for the GPU FE-comparison run (property_correction.tex §8.3); the
# global property correction makes a 3-D transform a per-iteration cost, so this
# production-grid case should run on GPU (backend: gpu).

simulation:
  name: "temp_dep_316L_centered"
  method: "spectral"
  backend: "cpu"
  duration:
    value: 6.0e-4
    unit: "s"
  dt:
    value: 2.0e-6
    unit: "s"
  update_interval: 50

domain:
  size: [2.0e-3, 1.0e-3, 0.5e-3]   # [Lx, Ly, Lz] in m (FE: 2 × 1 × 0.5 mm)
  mesh: [400, 200, 100]            # [nx, ny, nz] — refine for the convergence sweep

fine_mesh:
  refinement: 4
  box_size: [0.9e-3, 0.9e-3, 0.04e-3]

material:
  name: "316L"
  # Temperature-dependent: solid/liquid polynomial branches blended by f_l.
  k:
    solid:  [9.248, 0.01571]        # k_s  = 9.248 + 0.01571·T
    liquid: [12.41, 0.003279]       # k_l  = 12.41 + 0.003279·T
  rho:
    solid:  [8084.2, -0.42086, -3.8942e-5]
    liquid: [7432.7, 0.039338, -1.8007e-4]
  Cp:
    solid:  [458.98, 0.1328]        # c_s  = 458.98 + 0.1328·T
    liquid: [769.86]                # c_l  = 769.86 (constant)
  L_f:
    value: 2.677e5
    unit: "J/kg"
  T_solidus:
    value: 1674.15
    unit: "K"
  T_liquidus:
    value: 1697.15
    unit: "K"
  T0:
    value: 293.0
    unit: "K"
  h_conv:
    value: 3000.0
    unit: "W/(m2.K)"
  DeltaH_LV:
    value: 7.416e6
    unit: "J/kg"
  R_v:
    value: 150.774
    unit: "J/(kg.K)"
  Pa:
    value: 101325.0
    unit: "Pa"
  T_boil:
    value: 3090.0
    unit: "K"

laser:
  radius:
    value: 30.0e-6
    unit: "m"
  absorptivity: 0.30
  power_nominal:
    value: 24.0
    unit: "W"
  path:
    type: "gcode"
    file: "linear_track_centered.gcode"

io:
  output_interval:
    value: null
    unit: "dimensionless"
  outputs: [full_volume]
  at_end: [full_volume, profiles]
  profiles_locations:
    - 'laser'
  slice_planes:
    - xy
    - yz
    - xz
