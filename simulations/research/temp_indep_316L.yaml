# Temperature-INDEPENDENT counterpart of temp_dep_316L.yaml.
# Identical mesh / dt / duration / laser / domain; the only difference is that
# k, rho, Cp are constant scalars instead of polynomial branches, so the solver
# takes the constant-coefficient fast path (no per-step property correction).
#
# The constants are the polynomials of temp_dep_316L.yaml evaluated at T0=293 K
# (the reference constants the solver bakes into the ETD propagators):
#   k_bar = 13.851029999999998 W/(m.K)
#   rho_bar = 7957.544888242 kg/m3
#   c_bar = 497.8904 J/(kg.K)

simulation:
  name: "temp_indep_316L"
  backend: "cpu"
  duration:
    value: 6.0e-4
    unit: "s"
  dt:
    value: 2.0e-6
    unit: "s"
  update_interval: 50

domain:
  size:
    value: [2.0e-3, 1.0e-3, 0.5e-3]   # [Lx, Ly, Lz] in m (FE: 2 × 1 × 0.5 mm)
    unit: "m"
  mesh:
    value: [400, 200, 100]            # [nx, ny, nz]
    unit: ""

fine_mesh:
  refinement: 4
  box_size: [0.9e-3, 0.9e-3, 0.04e-3]

material:
  name: "316L"
  # Temperature-independent: constants = polynomials evaluated at T0=293 K.
  k:
    value: 13.851029999999998
    unit: "W/(m.K)"
  rho:
    value: 7957.544888242
    unit: "kg/m3"
  Cp:
    value: 497.8904
    unit: "J/(kg.K)"
  L_f:
    value: 2.677e5
    unit: "J/kg"
  T_solidus:
    value: 1674.15
    unit: "K"
  T_liquidus:
    value: 1697.15
    unit: "K"
  T0:
    value: 293.0
    unit: "K"
  h_conv:
    value: 3000.0
    unit: "W/(m2.K)"
  DeltaH_LV:
    value: 7.416e6
    unit: "J/kg"
  R_v:
    value: 150.774
    unit: "J/(kg.K)"
  Pa:
    value: 101325.0
    unit: "Pa"
  T_boil:
    value: 3090.0
    unit: "K"

laser:
  radius:
    value: 30.0e-6
    unit: "m"
  absorptivity: 0.30
  power_nominal:
    value: 24.0
    unit: "W"
  path:
    type: "gcode"
    file: "linear_track.gcode"     # v_scan = 0.150 m/s, start at x_min, y-centre

io:
  output_interval:
    value: null
    unit: "dimensionless"
  outputs: [full_volume]
  at_end: [full_volume, profiles]
  profiles_locations:
    - 'laser'
  slice_planes:
    - name: "surface_topview"
      normal: "z"
      isotherms:
        - ["T_s", 1674.15]
    - name: "transverse_section"
      normal: "x"
      isotherms:
        - ["T_s", 1674.15]
    - name: "longitudinal_section"
      normal: "y"
      isotherms:
        - ["T_s", 1674.15]
