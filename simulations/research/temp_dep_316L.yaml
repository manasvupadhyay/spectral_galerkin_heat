simulation:
  name: "temp_dep_316L"
  backend: "gpu"
  duration:
    value: 6.0e-4
    unit: "s"
  
  dt:
    value: 4.0e-6
    unit: "s"
  update_interval: 1
  
  max_picard_iter: 80
  # Picard relaxation. (contraction ≈1−ω)
  picard_omega: 0.31
  # The temperature-dependent property correction (property_correction.tex) turns
  # on automatically whenever k/rho/Cp are given as non-constant branches below.

domain:
  size:
    value: [2.0e-3, 1.0e-3, 0.5e-3]   # [Lx, Ly, Lz] in m (FE: 2 × 1 × 0.5 mm)
    unit: "m"
  mesh:
    value: [512, 256, 350]            # [nx, ny, nz] — reconstructs to 513×257×351
    unit: ""

fine_mesh:
  refinement: 2
  box_size: [0.9e-3, 0.9e-3, 0.04e-3]

material:
  name: "316L"
  # Temperature-dependent: solid/liquid branch expressions blended by f_l.
  # `reference` (REQUIRED) is the baked constant k̄/ρ̄/C̄p = ½(min+max) over
  # [T0, T_boil]; centering it matters for convergence. See 03_nonlinear_tdep.yaml.
  k:
    solid: "9.248 + 0.01571 * T"
    liquid: "12.41 + 0.003279 * T"
    reference: 24.5075
    unit: "W/(m.K)"
  rho:
    solid: "8084.2 - 0.42086 * T - 3.8942e-5 * T**2"
    liquid: "7432.7 + 0.039338 * T - 1.8007e-4 * T**2"
    reference: 6896.2365
    unit: "kg/m^3"
  Cp:
    solid: "458.98 + 0.1328 * T"
    liquid: "769.86"
    reference: 633.8752
    unit: "J/(kg.K)"
  L_f:
    value: 2.677e5
    unit: "J/kg"
  T_solidus:
    value: 1674.15
    unit: "K"
  T_liquidus:
    value: 1697.15
    unit: "K"
  T0:
    value: 293.0
    unit: "K"
  h_conv:
    value: 3000.0
    unit: "W/(m2.K)"
  DeltaH_LV:
    value: 7.416e6
    unit: "J/kg"
  R_v:
    value: 150.774
    unit: "J/(kg.K)"
  Pa:
    value: 101325.0
    unit: "Pa"
  T_boil:
    value: 3090.0
    unit: "K"

laser:
  radius:
    value: 30.0e-6
    unit: "m"
  absorptivity: 0.30
  power_nominal:
    value: 24.0
    unit: "W"
  path:
    type: "gcode"
    file: "linear_track_316L.gcode"  # v_scan = 0.150 m/s, start at x_min, y-centre

io:
  # Snapshot every 500 steps (= 0.002 s at dt=4e-6) so spectral output lines up
  # with the FE reference snapshots (t = 0.002, 0.004 … 0.012 s) for the L2 comparison.
  output_interval: 500
  outputs: [full_volume]
  at_end: [full_volume, profiles]
  profiles_locations:
    - 'laser'
  slice_planes:
    - name: "surface_topview"
      normal: "z"
      isotherms:
        - ["T_s", 1674.15]
    - name: "transverse_section"
      normal: "x"
      isotherms:
        - ["T_s", 1674.15]
    - name: "longitudinal_section"
      normal: "y"
      isotherms:
        - ["T_s", 1674.15]
