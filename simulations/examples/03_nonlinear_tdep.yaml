# Example 03: Non-linear run with temperature-dependent properties
#
# Thermal conductivity, density and specific heat vary with temperature
# (solid and liquid polynomial branches blended by the liquid fraction), making
# the diffusion problem non-linear. Each time step is solved with a Picard
# iteration and a global property correction (Green's first identity).
#
# A small-box, CPU-sized cousin of simulations/research/temp_dep_316L.yaml (which
# runs 512 x 256 x 350 on GPU). The domain is small with a fine z-grid so the thin
# mushy zone is resolved. Runtime is on the order of minutes.
#
# Run: uv run python simulations/main.py simulations/examples/03_nonlinear_tdep.yaml

simulation:
  name: "nonlinear_tdep"
  method: "spectral"
  backend: "cpu"              # GPU recommended for the full research grid.
  duration:
    value: 2.0e-4             # 50 steps at dt = 4e-6 s.
    unit: "s"
  dt:
    value: 4.0e-6
    unit: "s"
  update_interval: 1

  # Non-linear solve controls.
  max_picard_iter: 80         # Picard iteration cap per step. The property
                              # correction requires about 80 to converge.
  picard_omega: 0.31          # relaxation factor; 0.31 converges here, higher (0.45+) caps out.
  # picard_tol: 1.0e-4        # convergence tolerance (optional; default 1e-4).

domain:
  size: [0.5e-3, 0.3e-3, 0.12e-3]  # [Lx, Ly, Lz] in m (0.5 x 0.3 x 0.12 mm) — small box.
  mesh: [100, 60, 96]              # dz ~ 1.25 um resolves the mushy zone.

# Moving fine-mesh ROI that resolves the sharp mushy-zone gradients under the beam.
fine_mesh:
  refinement: 2                          # Fine cells per coarse cell, per axis.
  box_size: [0.2e-3, 0.15e-3, 0.04e-3]   # [Lx_box, Ly_box, Lz_box] in m.

material:
  name: "316L"
  # Temperature-dependent Chadwick et al. 316L properties. Each branch lists
  # polynomial coefficients [c0, c1, c2, ...] in ascending powers of T (SI units);
  # the solid and liquid branches are blended across the mushy zone by the liquid
  # fraction f_l(T). (Constant examples 01/02 use the solid branch at T0 = 293 K.)
  k:
    solid:  [9.248, 0.01571]        # k_s  = 9.248 + 0.01571*T
    liquid: [12.41, 0.003279]       # k_l  = 12.41 + 0.003279*T
  rho:
    solid:  [8084.2, -0.42086, -3.8942e-5]   # rho_s = 8084.2 - 0.42086*T - 3.8942e-5*T^2
    liquid: [7432.7, 0.039338, -1.8007e-4]   # rho_l = 7432.7 + 0.039338*T - 1.8007e-4*T^2
  Cp:
    solid:  [458.98, 0.1328]        # c_s  = 458.98 + 0.1328*T
    liquid: [769.86]                # c_l  = 769.86 (constant)
  L_f:
    value: 2.677e5
    unit: "J/kg"
  T_solidus:
    value: 1674.15
    unit: "K"
  T_liquidus:
    value: 1697.15
    unit: "K"
  T0:
    value: 293.0
    unit: "K"
  # T_ref:                    # Property-correction reference T (defaults to T0). The
  #   value: 293.0            #   linear diffusion is evaluated at T_ref; a warmer value
  #   unit: "K"               #   shrinks the fluctuation the correction resums.
  h_conv:
    value: 3000.0
    unit: "W/(m2.K)"
  DeltaH_LV:
    value: 7.416e6
    unit: "J/kg"
  R_v:
    value: 150.774
    unit: "J/(kg.K)"
  Pa:
    value: 101325.0
    unit: "Pa"
  T_boil:
    value: 3090.0
    unit: "K"

laser:
  radius:
    value: 30.0e-6
    unit: "m"
  absorptivity: 0.30
  power_nominal:
    value: 24.0
    unit: "W"
  path:
    type: "gcode"
    file: "example03_track.gcode"   # v_scan = 0.15 m/s, starts mid-domain (x = 0.3 mm).

io:
  run_tag: "nonlinear_tdep"
  output_interval: null
  outputs: [full_volume]
  at_end: [full_volume, slices, profiles]
  profiles_locations:
    - 'laser'
  slice_planes:
    - xz                      # normal y: longitudinal melt-pool section.
  slice_width: 0.16e-3        # horizontal (scanning) extent [m].
  slice_height: 0.035e-3      # vertical (build) extent [m].
  slice_liquidus_offset: 10.0 # plot the liquidus contour +10 K (visual separation).
