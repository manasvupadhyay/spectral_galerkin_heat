simulation:
  name: spectral_test_run
  method: spectral
  backend: cpu
  duration:
    value: 0.005
    unit: "s"
  dt:
    value: 2.5e-6
    unit: "s"
  update_interval: 20

domain:
  size: [0.005, 0.0025, 0.00125]  # [Lx, Ly, Lz] in m
  mesh: [10, 256, 500]             # [nx, ny, nz]

material:
  name: 316L
  rho:
    value: 7850.0
    unit: "kg/m3"
  k:
    value: 15.0
    unit: "W/(m.K)"
  Cp:
    value: 500.0
    unit: "J/(kg.K)"
  L_f:
    value: 267700.0
    unit: "J/kg"
  T_solidus:
    value: 1700
    unit: "K"
  T_liquidus:
    value: 1800.0
    unit: "K"
  T0:
    value: 293.0
    unit: "K"
  h_conv:
    value: 3000.0
    unit: "W/(m2.K)"
  DeltaH_LV:
    value: 7.41e6
    unit: "J/kg"
  R_v:
    value: 150.774
    unit: "J/(kg.K)"
  Pa:
    value: 101325.0
    unit: "Pa"
  T_boil:
    value: 3090.0
    unit: "K"

laser:
  radius:
    value: 6.0e-5
    unit: "m"
  absorptivity: 0.3
  power_nominal:
    value: 200.0
    unit: "W"
  path:
    type: gcode
    file: linear_track.gcode

io:
  output_interval:
    value: null
    unit: "dimensionless"
  outputs: []
  at_end:
    - full_volume
  profiles_locations:
    - hotspot
  cut_views_planes:
    - xy
    - yz
    - xz
