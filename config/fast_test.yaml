simulation:
  name: "spectral_test_run"
  method: "spectral"          # Options: "spectral", "fem"
  backend: "cpu"              # Options: "cpu" (standard), "gpu" (if supported)
  duration: 0.0005            # s
  dt: 5.0e-6                  # s
  update_interval: 20         # ETA update every 20 steps (approx)

domain:
  size: [0.01, 0.005, 0.0025] # [Lx, Ly, Lz] in m
  mesh: [512, 256, 1024]      # [nx, ny, nz]

material:
  name: "GenericSteel"
  rho: 7850.0                 # kg/m^3
  k: 15.0                     # W/(m·K)
  Cp: 500.0                   # J/(kg·K)
  L_f: 267700.0               # J/kg (Latent heat)
  T_solidus: 1700.0           # K
  T_liquidus: 1800.0          # K
  T0: 293.0                   # K (Ambient temperature)
  
  # Evaporation parameters
  DeltaH_LV: 7.41e6           # J/kg
  R_v: 150.774                # J/(kg·K)
  Pa: 101325.0                # Pa
  T_boil: 3090.0              # K

laser:
  radius: 60.0e-6             # m (r_b)
  absorptivity: 0.30          # (dimensionless)
  power_nominal: 200.0        # W
  
  path:
    type: "gcode"
    file: "linear_track.gcode"

io:
  interval: 1                         # (Output frequency, number of steps) (null means no intermediate outputs)
  outputs: []                  #[full_volume, profiles, cut_views, modes] (empty list means no periodic outputs)
  at_end: ["profiles", "cut_views"]   # Output profiles and cut views at the end of the simulation
  profiles_locations:
    - 'hotspot'                # m, 'laser' or 'hotspot' keyword
  cut_views_planes:
    - yz

microstructure:
  enabled: true
  initial_state:
    # Options: "synthetic_voronoi", "from_file"
    # If "synthetic_voronoi", you can provide 'n_grains' OR a specific 'command'
    type: "synthetic_voronoi"
    
    # Simple Mode:
    n_grains: 100

    # Advanced Mode (Neper Args):
    # Domain and Output are handled automatically.
    # Examples: "-n 100 -morpho gg", "-n 100 -morpho 'columnar(x)'"
    #command: "-n 100 -morpho gg"

    # File Mode:
    file: "seeds.txt"
