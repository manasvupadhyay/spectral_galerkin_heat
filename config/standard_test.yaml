simulation:
  name: "spectral_test_run"
  method: "spectral"          # Options: "spectral", "fem"
  backend: "cpu"              # Options: "cpu" (standard), "gpu" (if supported)
  duration: 0.012             # seconds
  dt: 6.0e-6                  # seconds
  output_interval: 1.2e-4     # Output every 20 steps (approx)

domain:
  size: [0.01, 0.005, 0.0025] # [Lx, Ly, Lz] in meters
  mesh: [512, 256, 1000]      # [nx, ny, nz]

material:
  name: "GenericSteel"
  rho: 7850.0
  k: 15.0
  Cp: 500.0
  L_f: 267700.0               # Latent heat J/kg
  T_solidus: 1700.0
  T_liquidus: 1800.0
  T0: 293.0                   # Ambient temperature
  
  # Evaporation parameters
  DeltaH_LV: 7.41e6
  R_v: 150.774
  Pa: 101325.0
  T_boil: 3090.0

laser:
  radius: 60.0e-6             # r_b in meters
  absorptivity: 0.30
  power_nominal: 200.0        # Default power if not specified in path
  
  path:
    type: "gcode"
    file: "linear_track.gcode"
    initial_position: [0.0, 0.0025] # [x, y] in meters, matches test_speed_spectral start
