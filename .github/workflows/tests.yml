name: Tests

# Unit suite on every push and pull request. Integration tests are excluded by
# the `addopts` in pyproject.toml: they run full simulations, and the GPU and
# FEniCS ones need hardware and toolchains no hosted runner has.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/tests.yml'
  workflow_dispatch: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up uv (with cache)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the CPU stack plus test tooling
        run: uv sync --extra dev

      - name: Run the unit suite
        run: uv run pytest -q

      - name: Check the CPU integration suite collects
        # Collection alone catches import errors and broken fixtures without
        # paying for full simulation runs on a hosted runner.
        run: uv run pytest -m integration --collect-only -q
