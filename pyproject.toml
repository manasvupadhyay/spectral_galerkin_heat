[project]
name = "fastheatsolv"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "numba>=0.64.0",
    "numpy>=2.4.3",
    "pyfftw>=0.15.1",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
gpu = [
    "cupy-cuda12x>=14.0.1",
]
viz = [
    "matplotlib>=3.10.8",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "isort>=8.0.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
]
