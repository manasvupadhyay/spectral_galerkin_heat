[project]
name = "fastheatsolv"
version = "0.1.0"
description = "A fast solver for the heat equation using spectral methods and GPU acceleration."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "matplotlib>=3.10.8",
    "numba>=0.64.0",
    "numpy>=2.4.3",
    "pyfftw>=0.15.1",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
]


#Install with:
#`pip install -e .[dev]`
#`pip install -e .[gpu]`
[project.optional-dependencies]
# GPU stack targets CUDA 13.x. The CUDA math libraries (cuFFT, cuBLAS, cuSOLVER,
# cuRAND, cuSPARSE), NVRTC and NVVM are provided by the *system* CUDA 13.2
# toolkit (/usr/local/cuda), located at runtime via cuda-pathfinder (CuPy) and
# numba's system-CTK discovery. No per-library nvidia-*-cu13 wheels are pinned:
# those names are empty placeholders on PyPI for CUDA 13.
gpu = [
    "cupy-cuda13x>=14.1.1",
]
viz = [
    "matplotlib>=3.10.8",
]
docs = [
    "sphinx>=8.1.3",
    "sphinx-rtd-theme>=3.0.1",
    "myst-parser>=4.0.0",
    "sphinx-design>=0.6.1",
]
dev = [
    "black>=26.3.1",
    "isort>=8.0.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
]


#Required for `uv` install:
#uv sync --group gpu --group viz --group dev
[dependency-groups]
# See note above: CUDA 13.x math libs / NVRTC / NVVM come from system CUDA 13.2.
gpu = [
    "cupy-cuda13x>=14.1.1",
]
viz = [
    "matplotlib>=3.10.8",
]
docs = [
    "sphinx>=8.1.3",
    "sphinx-rtd-theme>=3.0.1",
    "myst-parser>=4.0.0",
    "sphinxcontrib-mermaid>=2.0.1",
    "sphinx-autoapi>=3.8.0",
    "sphinx-design>=0.6.1",
]
dev = [
    "black>=26.3.1",
    "isort>=8.0.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
]


#Path to the library source code
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-m", "not integration"]
markers = [
    "integration: full simulation pipeline tests (slow — run with pytest -m integration)",
]
#have to be decided if skipping integreation default

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
